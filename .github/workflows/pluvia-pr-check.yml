name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [Legacy, Modern]
    runs-on: ubuntu-latest
    name: build (${{ matrix.variant }})

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          EOF
      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug bundle (${{ matrix.variant }})
        run: ./gradlew :app:bundle${{ matrix.variant }}Debug

      - name: Package installable debug APK (${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.variant }}"
          variant_lower="${variant,,}"
          bundle="app/build/outputs/bundle/${variant_lower}Debug/app-${variant_lower}-debug.aab"
          test -s "$bundle"
          test -f "$HOME/.android/debug.keystore"
          java -jar tools/bundletool-all-1.17.2.jar build-apks \
            --bundle="$bundle" \
            --output="GameNative-${variant_lower}-debug.apks" \
            --mode=universal \
            --ks="$HOME/.android/debug.keystore" \
            --ks-key-alias=androiddebugkey \
            --ks-pass=pass:android \
            --key-pass=pass:android
          unzip -p "GameNative-${variant_lower}-debug.apks" universal.apk \
            > "GameNative-shared-storage-${variant_lower}-debug.apk"
          test -s "GameNative-shared-storage-${variant_lower}-debug.apk"

      - name: Upload installable debug APK (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-shared-storage-${{ matrix.variant }}-debug
          path: GameNative-shared-storage-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests (${{ matrix.variant }})
        timeout-minutes: 45
        run: |
          : > gradle.log
          tail -n +1 -F gradle.log &
          tail_pid=$!
          ./gradlew :app:test${{ matrix.variant }}DebugUnitTest > gradle.log 2>&1 &
          gradle_pid=$!
          last_size=0
          stalled_for=0
          while kill -0 "$gradle_pid" 2>/dev/null; do
            sleep 15
            size=$(stat -c %s gradle.log)
            if [ "$size" -eq "$last_size" ]; then
              stalled_for=$((stalled_for + 15))
            else
              stalled_for=0
              last_size=$size
            fi
            if [ "$stalled_for" -ge 600 ]; then
              echo "::error::No Gradle output for 10 minutes, dumping test JVM threads"
              for pid in $(pgrep -f 'Gradle Test Executor'); do
                echo "===== jstack $pid ====="
                jstack "$pid" || true
              done
              pkill -f 'Gradle Test Executor' || true
              kill "$gradle_pid" || true
              sleep 2
              kill "$tail_pid" || true
              exit 1
            fi
          done
          wait "$gradle_pid"
          status=$?
          sleep 2
          kill "$tail_pid" || true
          exit $status
